[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench"
version = "0.1.0"
description = "Local dashboard for the work items you own and the code behind them"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
workbench = "workbench.cli:main"

[tool.setuptools]
packages = ["workbench", "workbench.providers"]

[tool.setuptools.package-data]
workbench = ["index.html", "static/*"]
